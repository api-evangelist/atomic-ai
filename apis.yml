aid: atomic-ai
name: Atomic AI
description: >-
  Atomic AI is a biotechnology company fusing machine learning with structural
  biology to unlock RNA drug discovery. Founded in 2017 by Raphael Townshend
  and based in San Francisco, the company builds ATOM-1, an AI foundation model
  that predicts the three-dimensional structure of RNA to enable the discovery
  and optimization of RNA-targeted small molecules and RNA-based medicines for
  previously undruggable targets, including certain cancers and neurodegenerative
  diseases. Atomic AI pairs its proprietary 3D RNA structure engine with
  large-scale in-house wet-lab assays. It is backed by Playground Global, 8VC,
  Greylock, and others. Atomic AI operates as a proprietary R&D drug-discovery
  platform and does not currently publish a public developer API, SDKs, or API
  documentation; this profile captures its public identity and web-surface
  signals for the API Evangelist network.
